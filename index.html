<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b5e20">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
  
  <title>Laporan Transparansi Kas Masjid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #faf8f5; font-family: system-ui, sans-serif; }
    .hijau-masjid { background-color: #1b5e20; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-md mx-auto mb-16" onload="muatDataPublikVercel()">

  <div class="flex items-center space-x-3 bg-white rounded-xl p-4 shadow-sm border border-gray-100 mb-4">
    <div class="w-10 h-10 rounded-full flex items-center justify-center shadow-inner overflow-hidden border border-gray-100 bg-gray-50 shrink-0">
      <img id="imgLogoHeader" src="" alt="Logo" class="w-full h-full object-cover hidden">
      <div id="fallbackIcon" class="text-xl">🕌</div>
    </div>
    <div>
      <h1 class="text-sm font-bold text-gray-800">Kas Masjid At Taqwa</h1>
      <p class="text-[10px] text-gray-400">Perum BMI 1, Dawuan Tengah, Cikampek, Karawang</p>
    </div>
  </div>

  <div class="bg-gradient-to-br from-emerald-800 to-emerald-950 text-white rounded-2xl p-5 shadow-sm border border-emerald-900 mb-6">
    <p class="text-[11px] uppercase tracking-wider opacity-75 font-semibold">Total Saldo Kas Saat Ini</p>
    <div class="flex items-baseline space-x-1 mt-1">
      <span class="text-sm opacity-90 font-medium">Rp</span>
      <h2 id="txtSaldoPublik" class="text-2xl font-black tracking-tight">Memuat...</h2>
    </div>
  </div>

  <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-2">
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Riwayat Transaksi Terakhir</h3>
      <input type="text" id="txtCariMutasi" oninput="filterDataMutasi()" 
             placeholder="🔎 Cari nama donatur, atau nota..." 
             class="w-full sm:w-64 text-xs px-3 py-1.5 rounded-lg border border-gray-200 focus:outline-none focus:border-emerald-600 bg-gray-50">
    </div>

    <div id="loadingText" class="text-xs text-gray-400 text-center py-4">Menghubungkan ke server amanah...</div>
    <div id="kontainerMutasi" class="space-y-3 hidden"></div>
  </div>

  <div class="text-center py-8 text-[11px] text-gray-400 space-y-1">
    <p>Dikembangkan secara swadaya oleh <a href="https://www.kasmasjid.web.id" target="_blank" class="text-emerald-700 font-bold hover:underline">KasMasjid</a></p>
    <p class="text-[9px] opacity-75">Sistem Alur Kerja Keuangan Mandiri • Dibangun untuk Kepercayaan Aset Digital</p>
  </div>

  <script>
    const URL_LOGO_MASJID = "https://ik.imagekit.io/kulinaweb/logo-attaqwa.png?updatedAt=1781786644208"; 
    const API_URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzBGi_JETGdPf2oJ7xp0rYhThmofSTnkpE3WST387258xJb4uV9NGHQlnO2Mcea6YZe/exec";

    let masterDataMutasi = [];

    function inisialisasiLogoHeader() {
      const img = document.getElementById('imgLogoHeader');
      const fallback = document.getElementById('fallbackIcon');
      if (URL_LOGO_MASJID && URL_LOGO_MASJID.trim() !== "") {
        img.src = URL_LOGO_MASJID;
        img.classList.remove('hidden');
        fallback.classList.add('hidden');
      }
    }

    function muatDataPublikVercel() {
      inisialisasiLogoHeader();

      fetch(API_URL_APPS_SCRIPT, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ aksi: "ambilDataPublik" })
      })
      .then(response => response.json())
      .then(res => {
        // PERBAIKAN: Menyatukan logika parsing data ke dalam block fetch yang benar
        let data = res;
        if (typeof res === "string") {
          data = JSON.parse(res);
        }

        if (data && data.saldo !== undefined) {
          document.getElementById('txtSaldoPublik').innerText = Number(data.saldo).toLocaleString('id-ID');
        } else {
          document.getElementById('txtSaldoPublik').innerText = "0";
        }
        
        if (data && data.mutasi) {
          masterDataMutasi = data.mutasi;
          tampilkanKeLayar(masterDataMutasi);
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('loadingText').innerText = "Gagal menyinkronkan data amanah.";
        document.getElementById('txtSaldoPublik').innerText = "0";
      });
    }

    function tampilkanKeLayar(daftarMutasi) {
      const kontainer = document.getElementById('kontainerMutasi');
      document.getElementById('loadingText').classList.add('hidden');
      kontainer.classList.remove('hidden');
      kontainer.innerHTML = "";

      if (daftarMutasi && daftarMutasi.length > 0) {
        daftarMutasi.forEach(item => {
          const div = document.createElement('div');
          div.className = "p-3 rounded-xl border-l-4 text-xs bg-gray-50 mb-2 " + 
                        (item.jenis === "Masuk" ? "border-emerald-600" : "border-red-500");
          
          div.innerHTML = `
            <div class="flex justify-between font-bold text-gray-700">
              <span>${item.nama}</span>
              <span class="${item.jenis === 'Masuk' ? 'text-emerald-700' : 'text-red-600'}">
                ${item.jenis === 'Masuk' ? '+' : '-'} Rp ${Number(item.nominal).toLocaleString('id-ID')}
              </span>
            </div>
            <div class="text-gray-400 text-[10px] mt-1 flex justify-between">
              <span>${item.keterangan}</span>
              <span>${item.tanggal}</span>
            </div>
          `;
          kontainer.appendChild(div);
        });
      } else {
        kontainer.innerHTML = "<div class='text-center text-xs text-gray-400 py-4'>Data pencarian tidak ditemukan.</div>";
      }
    }

    function filterDataMutasi() {
      const kataKunci = document.getElementById('txtCariMutasi').value.toLowerCase().trim();
      
      const hasilSaring = masterDataMutasi.filter(item => {
        return item.nama.toLowerCase().includes(kataKunci) || 
               item.keterangan.toLowerCase().includes(kataKunci) ||
               item.tanggal.toLowerCase().includes(kataKunci);
      });
      
      tampilkanKeLayar(hasilSaring);
    }
  </script>  
</body>
</html>
