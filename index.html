<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1b5e20">

  <script>
    // Daftarkan PWA Service Worker secara otomatis
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
  
  <title>Laporan Transparansi Kas Masjid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #faf8f5; font-family: system-ui, sans-serif; }
    .hijau-masjid { background-color: #1b5e20; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-md mx-auto mb-16" onload="muatDataPublikVercel()">

  <div class="flex items-center space-x-3 bg-white rounded-xl p-4 shadow-sm border border-gray-100 mb-4">
    <div class="w-12 h-12 rounded-full flex items-center justify-center shadow-inner overflow-hidden border border-gray-100 bg-gray-50 shrink-0">
      <img id="imgLogoHeader" src="" alt="Logo" class="w-full h-full object-cover hidden">
      <div id="fallbackIcon" class="text-xl">🕌</div>
    </div>
    <div>
      <h1 class="text-sm font-bold text-gray-800">Kas Masjid At Taqwa</h1>
      <p class="text-[10px] text-gray-400">Perum BMI 1, Dawuan Tengah, Cikampek, Karawang</p>
    </div>
  </div>

  <div class="bg-gradient-to-br from-emerald-800 to-emerald-950 text-white rounded-2xl p-5 shadow-sm border border-emerald-900 mb-6">
    <p class="text-[11px] uppercase tracking-wider opacity-75 font-semibold">Total Saldo Kas Saat Ini</p>
    <div class="flex items-baseline space-x-1 mt-1">
      <span class="text-sm opacity-90 font-medium">Rp</span>
      <h2 id="txtSaldoPublik" class="text-2xl font-black tracking-tight">Memuat...</h2>
    </div>
  </div>

  <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Riwayat Transaksi Terakhir</h3>
    <div id="loadingText" class="text-xs text-gray-400 text-center py-4">Menghubungkan ke server amanah...</div>
    <div id="kontainerMutasi" class="space-y-3 hidden"></div>
  </div>

  <div class="text-center py-8 text-[11px] text-gray-400 space-y-1">
    <p>Dikembangkan secara swadaya oleh <a href="https://kasmasjid.web.id" target="_blank" class="text-emerald-700 font-bold hover:underline">KasMasjid</a></p>
    <p class="text-[9px] opacity-75">Sovereign Financial Workflow System • Built for Digital Asset Trust</p>
  </div>

  <script>
    // 1. TEMPEL URL LOGO 500PX ANDA DI SINI (Bisa link ImageKit atau lokal /icon.png)
    const URL_LOGO_MASJID = "https://ik.imagekit.io/kulinaweb/logo-attaqwa.png?updatedAt=1781786644208"; 

    // URL Web App Apps Script Anda
    const API_URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfyf.../exec";

    // Fungsi Render Logo Efisien
    function inisialisasiLogoHeader() {
      const img = document.getElementById('imgLogoHeader');
      const fallback = document.getElementById('fallbackIcon');
      if (URL_LOGO_MASJID && URL_LOGO_MASJID.trim() !== "") {
        img.src = URL_LOGO_MASJID;
        img.classList.remove('hidden');
        fallback.classList.add('hidden');
      }
    }

    function muatDataPublikVercel() {
      // Jalankan fungsi tampil logo saat halaman dimuat
      inisialisasiLogoHeader();

      fetch(API_URL_APPS_SCRIPT, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ aksi: "ambilDataPublik" })
      })
      .then(response => {
        if (!response.ok) throw new Error("Jaringan bermasalah");
        return response.json();
      })
      .then(res => {
        // Antisipasi pembacaan string murni maupun objek JSON ter-parse
        let data = typeof res === "string" ? JSON.parse(res) : res;

        if (data && data.saldo !== undefined) {
          document.getElementById('txtSaldoPublik').innerText = Number(data.saldo).toLocaleString('id-ID');
        } else {
          document.getElementById('txtSaldoPublik').innerText = "0";
        }
        
        const kontainer = document.getElementById('kontainerMutasi');
        document.getElementById('loadingText').classList.add('hidden');
        kontainer.classList.remove('hidden');
        kontainer.innerHTML = "";

        if (data && data.mutasi && data.mutasi.length > 0) {
          data.mutasi.forEach(item => {
            const div = document.createElement('div');
            div.className = "p-3 rounded-xl border-l-4 text-xs bg-gray-50 mb-2 " + 
                          (item.jenis === "Masuk" ? "border-emerald-600" : "border-red-500");
            
            div.innerHTML = `
              <div class="flex justify-between font-bold text-gray-700">
                <span>${item.nama}</span>
                <span class="${item.jenis === 'Masuk' ? 'text-emerald-700' : 'text-red-600'}">
                  ${item.jenis === 'Masuk' ? '+' : '-'} Rp ${Number(item.nominal).toLocaleString('id-ID')}
                </span>
              </div>
              <div class="text-gray-400 text-[10px] mt-1 flex justify-between">
                <span>${item.keterangan}</span>
                <span>${item.tanggal}</span>
              </div>
            `;
            kontainer.appendChild(div);
          });
        } else {
          kontainer.innerHTML = "<div class='text-center text-xs text-gray-400 py-4'>Belum ada riwayat transaksi.</div>";
        }
      })
      .catch(err => {
        document.getElementById('loadingText').innerText = "Gagal memuat data: " + err;
        document.getElementById('txtSaldoPublik').innerText = "0";
      });
    }
  </script>  
</body>
</html>
